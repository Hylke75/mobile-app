# Wekelijkse controle op updates. Grote Expo/React Native-sprongen doen we bewust zelf
# (met `npx expo install --fix`), daarom alleen kleine updates voor die pakketten.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns:
          ['expo', 'expo-*', '@expo/*', 'react-native', 'react-native-*', 'react', 'react-dom']
        update-types: ['patch']
      overig:
        patterns: ['*']
        exclude-patterns:
          ['expo', 'expo-*', '@expo/*', 'react-native', 'react-native-*', 'react', 'react-dom']
        update-types: ['minor', 'patch']
    ignore:
      # Grote versiesprongen (breaking changes) doen we bewust zelf
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # React moet exact gelijk blijven aan de versie die bij React Native hoort; Expo bepaalt die
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      # Sentry volgt de versie die `npx expo install` voor deze SDK kiest
      - dependency-name: '@sentry/react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
