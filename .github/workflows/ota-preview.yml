name: OTA naar preview

# Na elke push naar main gaat de JavaScript-bundel automatisch naar het kanaal preview
# (testers met een preview-build krijgen hem bij de volgende start). Slaat zichzelf over
# zolang het repository-secret EXPO_TOKEN ontbreekt. Production blijft handmatig (update.yml).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'site/**', 'scripts/site-*', '**.md']

concurrency:
  group: ota-preview
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Controleer EXPO_TOKEN
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN ontbreekt; geen OTA-update." >> "$GITHUB_STEP_SUMMARY"
            echo "aanwezig=false" >> "$GITHUB_OUTPUT"
          else
            echo "aanwezig=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.aanwezig == 'true'
        uses: actions/checkout@v7
      - if: steps.token.outputs.aanwezig == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.aanwezig == 'true'
        run: npm ci
      - if: steps.token.outputs.aanwezig == 'true'
        run: npm run lint && npm run typecheck && npm test -- --ci
      - if: steps.token.outputs.aanwezig == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - if: steps.token.outputs.aanwezig == 'true'
        run: >-
          eas update --channel preview --environment preview --non-interactive
          --message "$(git log -1 --pretty=%s)"
