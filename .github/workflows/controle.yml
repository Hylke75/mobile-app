name: Controle

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  # Schermtests op de webversie. Zonder testaccount draaien alleen de openbare schermen;
  # zet de variabelen EXPO_PUBLIC_SUPABASE_URL/ANON_KEY en de secrets E2E_EMAIL/E2E_WACHTWOORD
  # in GitHub voor de volledige flow.
  schermtests:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://voorbeeld.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'voorbeeld' }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_WACHTWOORD: ${{ secrets.E2E_WACHTWOORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-sporen
          path: test-results/
          retention-days: 7
